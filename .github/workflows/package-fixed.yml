name: Package fixed SALGA Digital Mart

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          rm -rf .git
          rm -f SALGA-Digital-Mart-Fully-Fixed-Admin-Recovery.zip
          rm -f Sagbama-Digital-Marketplace-v9-Admin-Login-Fixed.zip
          rm -f salga-digital-mart-all-payments-customer-care.zip
          rm -f salga-digital-mart-new-from-scratch.zip
          rm -f salga-digital-mart-password-reset-ads-commission-patch.zip
          zip -r salga-digital-mart-fixed-vercel.zip . -x '*.DS_Store' -x 'node_modules/*'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: salga-digital-mart-fixed-vercel
          path: salga-digital-mart-fixed-vercel.zip
          if-no-files-found: error
