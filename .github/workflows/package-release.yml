name: Package SALGA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production ZIP
        run: |
          zip -r SALGA-Digital-Mart-production.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'dist/*' \
            -x 'SALGA-Digital-Mart-production.zip'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: salga-digital-mart-production
          path: SALGA-Digital-Mart-production.zip
          retention-days: 7
