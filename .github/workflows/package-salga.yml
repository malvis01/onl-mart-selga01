name: Package SALGA Digital Mart
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create deployment ZIP
        run: |
          zip -r SALGA-Digital-Mart-current.zip . -x '.git/*' '.github/*' 'SALGA-Digital-Mart-current.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: SALGA-Digital-Mart-current
          path: SALGA-Digital-Mart-current.zip
          retention-days: 1
