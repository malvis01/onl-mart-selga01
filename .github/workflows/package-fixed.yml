name: Package fixed SALGA Digital Mart

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          find netlify/functions -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Netlify site
        run: npm run build

      - name: Create source deployment package
        run: |
          rm -rf .git
          rm -f -- *.zip
          zip -r salga-digital-mart-source.zip . -x '*.DS_Store' -x 'node_modules/*' -x '*.zip'

      - name: Create Netlify publish package
        run: |
          cd dist
          zip -r ../salga-digital-mart-netlify-dist.zip . -x '*.DS_Store' -x '*.zip'

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: salga-digital-mart-source
          path: salga-digital-mart-source.zip
          if-no-files-found: error

      - name: Upload Netlify package
        uses: actions/upload-artifact@v4
        with:
          name: salga-digital-mart-netlify-dist
          path: salga-digital-mart-netlify-dist.zip
          if-no-files-found: error
