name: Fix admin section nesting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-admin-section:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix admin section nesting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '\n<section id="admin" class="hidden">'
          replacement = '\n</section>\n\n<section id="admin" class="hidden">'
          if marker not in s:
              raise SystemExit('Admin section marker not found; no changes made.')
          if '\n</section>\n\n<section id="admin" class="hidden">' in s:
              raise SystemExit('Admin section is already separated.')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-admin-navigation.yml
          git commit -m 'fix: separate admin login from customer care'
          git push