name: SALGA customer care one-time fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply customer care fixes
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          old = '''    <h3>Contact Platform Customer Care</h3>

    <div
      id="careChat"
      class="chat-box">
    </div>

    <div class="row">

      <input
        id="careInput"
        placeholder="Write your message..."
        style="flex:1;padding:11px;border:1px solid #d6dde1;border-radius:8px"
        onkeydown="if(event.key==='Enter')sendCareMessage()">

      <button
        class="btn"
        onclick="sendCareMessage()">
        Send
      </button>

    </div>
'''

          if old not in text:
              raise SystemExit("Expected duplicate customer-care chat block was not found; refusing to modify index.html")

          text = text.replace(old, "", 1)
          index.write_text(text, encoding="utf-8")

          chat = Path("netlify/functions/chat.mjs")
          c = chat.read_text(encoding="utf-8")

          old_instruction = '''Be friendly, concise and practical. Current role: ${body.context?.role||"guest"}.`,input:message,max_output_tokens:700});'''
          new_instruction = '''Be friendly, complete and practical. Answer the user's full question rather than stopping mid-answer. Give clear numbered steps when the user is asking how to do something. Include important conditions, next steps and warnings when relevant. Do not unnecessarily ask follow-up questions if you can answer from the platform information you have. Current role: ${body.context?.role||"guest"}.`,input:message,max_output_tokens:1400});'''

          if old_instruction not in c:
              raise SystemExit("Expected AI Customer Care instruction block was not found; refusing to modify chat.mjs")

          c = c.replace(old_instruction, new_instruction, 1)
          chat.write_text(c, encoding="utf-8")

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html netlify/functions/chat.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: simplify customer care and improve AI answers"
          git push

      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/salga-customer-care-fix.yml || true
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time customer care patch workflow"
          git push
