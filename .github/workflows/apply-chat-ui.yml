name: Apply SALGA chat UI

on:
  push:
    paths:
      - .github/chat-ui-apply

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject chat UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/chat-ui-enhancements.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Chat UI script already installed.')
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'SALGA Digital Mart Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/chat-ui-apply .github/workflows/apply-chat-ui.yml
          git add index.html .github/chat-ui-apply .github/workflows/apply-chat-ui.yml
          git diff --cached --quiet || git commit -m 'Add buyer business and SALGA admin chat UI'
          git push
